<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product - 3D Store</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/product-detail.css" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="logo">3D<span>Store</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart <span id="cartBadge" class="cart-badge hidden"></span></a>
      <a href="login.html">Login</a>
    </div>
  </nav>

  <section class="product-detail">
    <model-viewer
      id="product-3d"
      src="https://modelviewer.dev/shared-assets/models/glTF-Sample-Models/2.0/MaterialsVariantsShoe/glTF-Binary/MaterialsVariantsShoe.glb"
      alt="3D Sneaker"
      camera-controls
      auto-rotate
      shadow-intensity="1.2"
      exposure="1.1"
      camera-orbit="20deg 75deg 2.5m"
    ></model-viewer>

    <div class="product-details-info">
      <span id="productCategory" class="product-category"></span>
      <h1 id="productName">Loading...</h1>
      <p id="productPrice" class="product-price"></p>
      <p class="hint">🖱️ Drag to rotate · Scroll to zoom</p>
      <button id="addToCartBtn" class="btn-primary" aria-label="Add product to cart">Add to Cart</button>
    </div>
  </section>

  <script src="js/products-data.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/product-viewer.js"></script>
</body>
</html>
