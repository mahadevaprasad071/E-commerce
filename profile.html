<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - 3D Store</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/profile.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">3D<span>Store</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart <span id="cartBadge" class="cart-badge hidden"></span></a>
      <a href="login.html" id="authLink">Login</a>
    </div>
  </nav>

  <section class="profile-section">

    <div class="profile-header">
      <div class="avatar">
  <svg viewBox="0 0 24 24" fill="currentColor" class="avatar-icon">
    <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9z"/>
  </svg>
</div>
      <div>
        <h1 id="profileName">—</h1>
        <p id="profileEmail" class="profile-email">—</p>
      </div>
    </div>

    <div class="profile-tabs">
      <h2>Order History</h2>
    </div>

    <div id="ordersList" class="orders-list">
      <!-- Orders injected by JS -->
    </div>

    <div id="noOrders" class="no-orders hidden">
      <p>No orders yet.</p>
      <a href="products.html" class="btn-primary">Start Shopping</a>
    </div>

    <button id="logoutBtn" class="logout-btn">Log Out</button>

  </section>

  <script src="js/cart-store.js"></script>
  <script src="js/auth-store.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
