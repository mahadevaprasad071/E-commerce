<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - 3D Store</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">3D<span>Store</span></div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">Cart <span id="cartBadge" class="cart-badge hidden"></span></a>
      <a href="login.html" id="authLink">Login</a>
    </div>
  </nav>

  <div class="auth-container">
    <div id="auth-3d"></div>

    <form id="signupForm" class="auth-card">
      <h1>Create Account</h1>

      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="John Doe" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>

      <button type="submit">Sign Up</button>

      <p class="switch-text">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </form>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/three-auth.js"></script>
  <script src="js/cart-store.js"></script>
  <script src="js/auth-store.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
